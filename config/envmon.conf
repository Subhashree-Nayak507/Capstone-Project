# EnvMon daemon configuration  (CLI options override these values)
device         = /dev/envmon
simulate       = false
period_ms      = 500
socket         = /tmp/envmon.sock
log_file       = /tmp/envmond.log
csv_file       = /tmp/envmon_samples.csv
log_level      = info
queue_capacity = 1024
window         = 20          # moving-average window (samples)

# alert thresholds (deg C / %RH)
warn_temp  = 30
crit_temp  = 35
warn_hum   = 70
crit_hum   = 85
hysteresis = 1.0
